name: gigmatch
description: "GigMatch - Where Artists Meet Stages. Premium music gig matching platform."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 🎨 PREMIUM DESIGN DEPENDENCIES

  # World-class typography from Google Fonts
  google_fonts: ^8.0.0

  # Premium icons (Phosphor, Lucide style)
  flutter_phosphor_icons: ^0.0.1+6
  iconsax: ^0.0.8

  # Smooth animations
  flutter_animate: ^4.5.2

  # Shimmer loading effects
  shimmer: ^3.0.0

  # Blur effects for glassmorphism
  blur: ^4.0.2

  # SVG support for custom graphics
  flutter_svg: ^2.0.16

  # Cached network images with blur hash
  cached_network_image: ^3.4.1

  # Date formatting
  intl: ^0.20.0

  # Card swipe (core feature)
  flutter_card_swiper: ^7.0.1

  # Smooth page transitions
  page_transition: ^2.2.1

  # Image/Video picker for media upload
  image_picker: ^1.1.2

   # File selector for audio and other files
  file_selector: ^1.0.3

  # 🌐 NETWORKING & STATE MANAGEMENT

  # HTTP client for API calls
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Secure storage for tokens
  flutter_secure_storage: ^10.0.0

  # WebSocket for real-time chat
  socket_io_client: ^3.0.2

  # JSON serialization
  json_annotation: ^4.9.0

  # Pull to refresh
  pull_to_refresh: ^2.0.0

  # Toast notifications
  fluttertoast: ^9.0.0

  # Loading indicators
  flutter_spinkit: ^5.2.1

  # Connectivity check
  connectivity_plus: ^7.0.0

  # Location services
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  
  # OpenStreetMap for map preview
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Missing dependencies from build errors
  visibility_detector: ^0.4.0+2
  emoji_picker_flutter: 4.4.0
  permission_handler: ^12.0.1
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^20.0.0
  web_socket_channel: ^3.0.3
  share_plus: ^12.0.1
  just_audio: ^0.10.5
  video_player: ^2.10.0
  url_launcher: ^6.3.0

  # 🔐 SOCIAL LOGIN
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  go_router: ^17.0.1
  app_links: ^7.0.0
  record: ^6.1.2
  path_provider: ^2.1.5

  # 💳 PAYMENTS
  flutter_stripe: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # JSON code generation
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # App icon generator
  flutter_launcher_icons: ^0.14.4

  # Native splash screen (Android 12+ compatible)
  flutter_native_splash: ^2.4.7

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 26
  remove_alpha_ios: true
  background_color_ios: "#000000"
  # Adaptive icons for Android 8+ with black background
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Flutter Native Splash configuration
# This handles the splash screen for ALL Android versions including Android 12+
flutter_native_splash:
  # Background color for pre-Android 12 (crimson brand color)
  color: "#DC2626"
  color_dark: "#DC2626"
  
  # Splash image (white G logo on transparent - will show on crimson bg)
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  
  # Fullscreen mode (hide status bar)
  fullscreen: true
  
  # Android 12+ specific configuration
  android_12:
    # Window background color (crimson)
    color: "#DC2626"
    color_dark: "#DC2626"
    
    # Center icon (white G logo - will be masked to circle)
    # Size should be 1152x1152 with logo fitting in 768px diameter circle
    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png
    
    # Icon background color (crimson - matches the brand)
    icon_background_color: "#DC2626"
    icon_background_color_dark: "#DC2626"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 🎨 ASSETS
  assets:
    - assets/images/
    - assets/images/onboarding/

  # 🔤 FONTS (Satoshi from Fontshare - Modern, Premium Typography)
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
